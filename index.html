<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/Style.css">

    <title>Tela De Cadastro</title>
</head>
<body>
    <div id="main-container">
    <h1>Cadastra-se para acessar o sistema </h1>
    <form id="register-form">
       <div class="full-box">
            <label for="email">E-mail</label>
             <input type="email" name="email" id="email" placeholder="Digite seu e-mail" data-min-length="2" data-email-validate>
        </div>
         <div class="half-box spacing">
            <label for="name">Nome</label>
            <input type="text" name="name" id="name" placeholder="Digite seu nome" data-required data-min-length="3" data-max-length="16">
        </div>
        <div class="half-box">
            <label for="lastName">Segundo Nome</label>
             <input type="text" name="lastname" id="lastname" placeholder="Digite seu sobrenome" data-required data-only-letters>
        </div>
        <div class="half-box spacing">
            <label for="password">Senha</label>
            <input type="password" name="password" id="password" placeholder="Digite sua senha" data-password-validate data-required>
        </div>
        <div class="half-box">
            <label for="passwordConfirme">Confirmação de senha</label>
            <input type="password" name="passconfirmation" id="passwordconfirmation" placeholder="Digite novamente sua senha" data-equal="password" data-required>
        </div>
          <div class="full-box">
            <input type="checkbox" name="agreement" id="agreement" data-required>
            <label for="agreement" id="agreement-label"> Eu li e aceito os <a href="#">termos de uso</a></label>
         </div>
          <div class="full-box">
            <input type="submit" value="Registrar" id="btn-submit">
        </div>    
    </form>
    <p class="error-validation template"></p>
    </div>
    <script src="js/scripts.js"></script>
    

    
</body>
</html>
